name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compile with the csc.exe that ships with Windows
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:nbd_server.exe /platform:x64 /optimize+ nbd_server.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - run: .\nbd_server.exe --help
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Serve a file-backed disk and read it back over NBD
        run: python tests/nbd_smoke.py nbd_server.exe
